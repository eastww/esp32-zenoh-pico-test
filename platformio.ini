; ============================================================
; Zenoh-Pico ESP32 Test Project
; ============================================================
; Board: adjust `board` to match your ESP32 devkit
;   - esp32dev      : generic ESP32 (most common)
;   - az-delivery-devkit-v4 : AZ-Delivery ESP32 DevKit V4
;   - esp32-wrover-kit      : WROVER Kit
;   - esp32-s3-devkitc-1    : ESP32-S3
;   - esp32-c3-devkitm-1    : ESP32-C3
; ============================================================

[env:esp32]
platform = espressif32
; NodeMCU-32 V1.2 (ESP32, CP2102 USB-UART)
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; 自定义脚本：确保 VS Code 扩展能找到 CMake/Ninja/LLVM-MinGW
extra_scripts =
    pre:extra_script.py

; zenoh-pico library (latest 1.x, includes extra_script.py that
; auto-configures the correct platform sources/defines)
lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico.git

; ------------------------------------------------------------------
; Optional: tune zenoh-pico buffer sizes for limited MCU memory.
; Defaults from extra_script.py are already embedded-friendly
; (FRAG_MAX_SIZE=4096, BATCH_UNICAST_SIZE=2048, ...).
; Uncomment to override further / reduce RAM usage:
; ------------------------------------------------------------------
; board_build.cmake_extra_args =
;     -DFRAG_MAX_SIZE=2048
;     -DBATCH_UNICAST_SIZE=1024
;     -DBATCH_MULTICAST_SIZE=1024

; Use Ninja generator for the host-side cmake config step.
; (Requires Ninja installed: winget install Ninja-build.Ninja)
; Without this, cmake on Windows tries to use nmake from Visual Studio,
; which is not installed on this machine.
board_build.cmake_extra_args =
    -G Ninja

; Build flags for your local test program
build_flags =
    -DZENOH_TEST_APP